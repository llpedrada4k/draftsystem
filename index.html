<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Draft Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
@property --glow { syntax: '<color>'; inherits: true; initial-value: #5b6b8c; }

:root {
  --bg: #eef0f5; --panel: #ffffff; --panel2: #f3f5fa; --text: #12151f; --muted: #626a80; --line: #d6dbe7;
  --warn: #c2410c; --ok: #15803d;
  --glow: #5b6b8c; --tile: 112px;
  --tA: #f2b01e; --tB: #2fb4f0; --tC: #a66cf0;
  --head: 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif;
  --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  transition: --glow .9s ease;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090b11; --panel: #121622; --panel2: #1a2030; --text: #f3f5fa; --muted: #8c94a9; --line: #272e44;
    --warn: #ff9a5c; --ok: #5ee08a;
  }
}
:root[data-theme="dark"] {
  --bg: #090b11; --panel: #121622; --panel2: #1a2030; --text: #f3f5fa; --muted: #8c94a9; --line: #272e44;
  --warn: #ff9a5c; --ok: #5ee08a;
}
html { background: var(--bg); scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; min-height: 100%; background: transparent; color: var(--text); font-family: var(--body); font-weight: 500; font-size: 16px; line-height: 1.35; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--glow); outline-offset: 2px; }

.bgglow { position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(900px 560px at 50% -8%, color-mix(in srgb, var(--glow) 48%, transparent), transparent 72%),
    radial-gradient(640px 480px at 100% 100%, color-mix(in srgb, var(--glow) 26%, transparent), transparent 70%),
    radial-gradient(640px 480px at 0% 100%, color-mix(in srgb, var(--glow) 26%, transparent), transparent 70%);
  animation: breathe 4s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { opacity: .85 } 50% { opacity: 1 } }

/* barra fixa do app: marca à esquerda, logo à direita, sempre visível */
.appbar { position: fixed; top: 0; left: 0; right: 0; z-index: 500; height: calc(68px + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) 18px 0; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.brand { font-family: var(--head); font-weight: 800; font-style: italic; font-size: clamp(28px, 5vw, 40px); letter-spacing: .01em; text-transform: uppercase; line-height: 1; margin: 0; white-space: nowrap; }
.brand small { display: block; font-size: 14px; font-style: normal; font-weight: 600; letter-spacing: .04em; color: var(--muted); margin-top: 3px; text-transform: none; }
.logo { height: 52px; padding: 4px 12px; border-radius: 14px; background: #fff; box-shadow: 0 0 0 2px var(--glow), 0 6px 24px -6px var(--glow); display: flex; align-items: center; flex: none; transition: box-shadow .9s ease; }
.logo img { height: 100%; width: auto; display: block; }
@media (max-width: 520px) { .brand small { display: none; } .logo { height: 44px; } .appbar { padding-left: 14px; padding-right: 14px; } }
.wrap { max-width: 1120px; margin: 0 auto; padding: 88px 18px 120px; }

.sec { margin-top: 26px; }
.sec:first-child { margin-top: 0; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.sec-h h2 { font-family: var(--head); font-weight: 800; font-style: italic; text-transform: uppercase; font-size: 30px; margin: 0; letter-spacing: .02em; }
.sec-h p { margin: 0; color: var(--muted); font-size: 15px; }

/* capitães */
.caps { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.cap { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px 14px 14px 22px;
  box-shadow: inset 6px 0 0 var(--c), 0 10px 40px -18px var(--c); display: grid; gap: 10px; transition: box-shadow .3s; animation: pop .35s ease; }
@keyframes pop { from { transform: scale(.92); opacity: 0 } to { transform: none; opacity: 1 } }
.cap-top { display: flex; align-items: center; gap: 10px; }
.num { flex: none; width: 38px; height: 38px; border-radius: 12px; background: var(--c); color: #fff; display: grid; place-items: center; font-family: var(--head); font-weight: 800; font-size: 24px; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
.capname { flex: 1; min-width: 0; width: 100%; background: var(--panel2); border: 2px solid transparent; border-radius: 12px; color: var(--text); font-family: var(--head); font-weight: 700; font-size: 24px; padding: 6px 12px; text-transform: uppercase; letter-spacing: .02em; }
.capname:focus { outline: none; border-color: var(--c); }
.colors { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; background: var(--d); padding: 0; transition: transform .15s; }
.dot:hover { transform: scale(1.2); }
.dot.on { border-color: var(--text); box-shadow: 0 0 0 2px var(--panel); }
.custom { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; position: relative; background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red); cursor: pointer; }
.custom input { position: absolute; inset: -8px; width: 48px; height: 48px; opacity: 0; cursor: pointer; }
.rm { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; }
.rm:hover { background: var(--panel2); color: var(--text); }
.rm.off { opacity: .3; }
.addcap { min-height: 118px; border: 2px dashed var(--line); border-radius: 18px; background: transparent; color: var(--muted); font-family: var(--head); font-weight: 700; font-size: 24px; display: grid; place-items: center; transition: all .2s; }
.addcap b { font-size: 40px; line-height: 1; display: block; }
.addcap:hover { border-color: var(--glow); color: var(--text); transform: translateY(-2px); }

.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; padding: 8px 16px; border-radius: 10px; font-family: var(--head); font-weight: 700; font-size: 19px; color: var(--muted); }
.seg button.on { background: var(--text); color: var(--bg); }

/* jogadores */
.players-box { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; }
.tiles { padding: 14px; display: grid; grid-template-columns: repeat(auto-fill, var(--tile)); gap: 10px; align-content: start; justify-content: start; min-height: calc(var(--tile) + 28px); }

.tile { --tc: var(--glow); position: relative; width: var(--tile); height: var(--tile); border-radius: 16px; background: var(--panel2); border: 2px solid var(--line); border-top: 6px solid var(--tc); cursor: text; touch-action: manipulation; user-select: none; -webkit-user-select: none; transition: transform .15s, box-shadow .15s, opacity .15s; animation: pop .3s ease; }
.tile:hover { transform: translateY(-3px); box-shadow: 0 10px 24px -10px var(--tc); }
.tile.dragging { opacity: .25; }
.tile.bye { transform: scale(.6); opacity: 0; }
.tile .nm { position: absolute; inset: 6px 8px 8px; display: flex; align-items: center; justify-content: center; text-align: center; font-family: var(--head); font-weight: 800; text-transform: uppercase; line-height: .95; overflow: hidden; }
.tile .nm span { display: block; width: 100%; overflow-wrap: normal; word-break: normal; }
.tile .x { position: absolute; top: -10px; right: -8px; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--panel); background: var(--text); color: var(--bg); font-size: 16px; line-height: 1; padding: 0; opacity: 0; transform: scale(.7); transition: all .15s; z-index: 2; }
.tile:hover .x, .tile:focus-within .x { opacity: 1; transform: none; }
@media (hover: none) { .tile .x { opacity: .9; transform: none; } }
.tile .edit { position: absolute; inset: 4px; width: calc(100% - 8px); height: calc(100% - 8px); border: 0; border-radius: 10px; background: var(--bg); color: var(--text); text-align: center; font-family: var(--head); font-weight: 800; font-size: 20px; text-transform: uppercase; z-index: 3; padding: 4px; }
.tile .edit:focus { outline: 2px solid var(--tc); }
.tile.add { border: 2px dashed var(--line); border-top: 2px dashed var(--line); background: transparent; display: grid; place-items: center; color: var(--muted); font-size: 46px; font-weight: 500; cursor: pointer; touch-action: manipulation; padding: 0; }
.tile.add:hover { color: var(--tc); border-color: var(--tc); background: color-mix(in srgb, var(--tc) 10%, transparent); }

/* barra inferior */
.bar { position: sticky; bottom: 0; z-index: 20; margin: 0 -18px; padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.bar.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px) } 40%, 80% { transform: translateX(8px) } }
.status { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 15px; }
.chip { display: inline-flex; gap: 6px; align-items: center; padding: 5px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); }
.chip.ok { color: var(--ok); }
.chip.bad { color: var(--warn); }
.msg { color: var(--warn); font-weight: 600; }
.start { border: 0; border-radius: 16px; padding: 12px 34px; font-family: var(--head); font-weight: 800; font-style: italic; font-size: 30px; text-transform: uppercase; letter-spacing: .03em; background: var(--text); color: var(--bg); transition: transform .15s, box-shadow .2s; box-shadow: 0 10px 30px -10px var(--text); }
.start:hover { transform: translateY(-2px) scale(1.02); }
.start.off { opacity: .35; box-shadow: none; }
.start.off:hover { transform: none; }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .25s; z-index: 300; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* sorteio */
.overlay { position: fixed; inset: 0; z-index: 100; padding-top: calc(88px + env(safe-area-inset-top, 0px)) !important; background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 20px; text-align: center; overflow: auto; }
.overlay h2 { font-family: var(--head); font-weight: 800; font-style: italic; text-transform: uppercase; font-size: clamp(32px, 7vw, 56px); margin: 0; line-height: 1; }
.overlay p { margin: 0; color: var(--muted); font-size: 18px; min-height: 1.4em; }
.ball { --bc: #5b6b8c; width: min(58vw, 290px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.6), transparent 26%), radial-gradient(circle at 50% 50%, var(--bc) 58%, color-mix(in srgb, var(--bc) 50%, #000) 100%);
  box-shadow: 0 0 90px color-mix(in srgb, var(--bc) 70%, transparent), inset 0 -16px 30px rgba(0,0,0,.3); transition: background .08s; }
.ball.rolling { animation: wobble .28s linear infinite; }
.ball.land { animation: land .7s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes wobble { 0% { transform: translate(0, 0) rotate(0) } 25% { transform: translate(5px, -4px) rotate(3deg) } 50% { transform: translate(-4px, 4px) rotate(-3deg) } 75% { transform: translate(4px, 3px) rotate(2deg) } 100% { transform: translate(0, 0) rotate(0) } }
@keyframes land { 0% { transform: scale(.82) } 100% { transform: scale(1) } }
.bi { width: 70%; aspect-ratio: 1; border-radius: 50%; background: #fff; color: #10131c; display: flex; align-items: center; justify-content: center; text-align: center; padding: 14%; font-family: var(--head); font-weight: 800; text-transform: uppercase; line-height: .95; overflow: hidden; }
.bi span { display: block; width: 100%; }
.slots { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.slot { --c: var(--line); width: 128px; height: 74px; border-radius: 14px; border: 2px dashed var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 8px; gap: 2px; transition: all .3s; }
.slot b { font-family: var(--head); font-weight: 800; font-size: 20px; color: var(--muted); line-height: 1; }
.slot .sn { width: 100%; height: 30px; display: flex; align-items: center; justify-content: center; font-family: var(--head); font-weight: 800; text-transform: uppercase; line-height: 1; overflow: hidden; }
.slot .sn span { display: block; width: 100%; }
.slot.filled { border: 2px solid var(--c); background: var(--c); color: #fff; transform: scale(1.05); text-shadow: 0 1px 2px rgba(0,0,0,.4); animation: pop .4s ease; }
.slot.filled b { color: rgba(255,255,255,.8); }
.obtn { border: 2px solid var(--text); background: transparent; border-radius: 14px; padding: 8px 20px; font-family: var(--head); font-weight: 700; font-size: 22px; text-transform: uppercase; }
.obtn:hover { background: var(--text); color: var(--bg); }
.obtn.big { background: var(--text); color: var(--bg); font-size: 32px; font-style: italic; font-weight: 800; padding: 10px 36px; animation: pop .4s ease; }
.closex { position: absolute; top: calc(80px + env(safe-area-inset-top, 0px)); left: 14px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); font-size: 22px; line-height: 1; }
.spark { position: fixed; width: 9px; height: 9px; border-radius: 2px; z-index: 400; pointer-events: none; animation: spark .85s ease-out forwards; }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) rotate(420deg) scale(.3); opacity: 0 } }

/* draft */
.dhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.round { color: var(--muted); font-weight: 600; font-size: 16px; margin: 0 0 2px; }
.turn { font-family: var(--head); font-weight: 800; font-style: italic; text-transform: uppercase; font-size: clamp(38px, 8vw, 74px); line-height: .95; margin: 0; }
.turn em { font-style: inherit; color: var(--glow); text-shadow: 0 0 40px var(--glow); }
.dctl { display: flex; gap: 8px; flex-wrap: wrap; }
.sbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 7px 16px; font-family: var(--head); font-weight: 700; font-size: 19px; text-transform: uppercase; }
.sbtn:hover:not(:disabled) { border-color: var(--glow); }
.sbtn:disabled { opacity: .35; cursor: default; }
.sbtn.danger.armed { background: var(--warn); color: #fff; border-color: var(--warn); }
.next { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; color: var(--muted); font-weight: 600; font-size: 15px; }
.nx { --c: #888; background: var(--c); color: #fff; border-radius: 99px; padding: 3px 12px; font-family: var(--head); font-weight: 700; font-size: 16px; text-transform: uppercase; text-shadow: 0 1px 2px rgba(0,0,0,.4); opacity: .55; }
.nx:first-of-type { opacity: 1; box-shadow: 0 0 0 3px var(--panel), 0 0 0 5px var(--c); }
.dgrid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 820px) { .dgrid { grid-template-columns: 1fr; } :root { --tile: 92px; } }
.pool, .teams { background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 20px; padding: 14px; }
.pool h3, .teams h3 { font-family: var(--head); font-weight: 800; font-style: italic; text-transform: uppercase; font-size: 24px; margin: 0 0 10px; }
.rows { display: grid; gap: 6px; }
.row { --tc: var(--glow); display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 2px solid var(--line); border-left: 8px solid var(--tc); background: var(--panel2); border-radius: 12px; padding: 8px 14px; transition: transform .18s, border-color .18s, background .18s, box-shadow .18s; }
.row .rn { flex: 1; min-width: 0; font-family: var(--head); font-weight: 700; font-size: 26px; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: .01em; }
.row .go { font-family: var(--head); font-weight: 700; font-size: 17px; text-transform: uppercase; opacity: 0; transform: translateX(-8px); transition: all .18s; color: var(--glow); }
.row:hover, .row:focus-visible { transform: translateX(6px); border-color: var(--glow); border-left-color: var(--tc); box-shadow: 0 0 30px -8px var(--glow); }
.row:hover .go, .row:focus-visible .go { opacity: 1; transform: none; }
.row.taken { animation: taken .4s ease forwards; pointer-events: none; }
@keyframes taken { 40% { transform: translateX(14px) scale(1.03); background: var(--glow); } 100% { transform: translateX(80px) scale(.9); opacity: 0; } }
.tcards { display: grid; gap: 12px; }
.team { --c: #888; border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px; background: var(--panel2); transition: box-shadow .4s, border-color .4s; }
.team.active { border-color: var(--c); box-shadow: 0 0 36px -4px var(--c); }
.team h4 { margin: 0 0 6px; display: flex; align-items: center; gap: 8px; font-family: var(--head); font-weight: 800; font-style: italic; font-size: 26px; text-transform: uppercase; line-height: 1; }
.team h4 i { width: 14px; height: 14px; border-radius: 50%; background: var(--c); flex: none; box-shadow: 0 0 12px var(--c); }
.team h4 small { margin-left: auto; font-style: normal; font-weight: 600; font-size: 14px; color: var(--muted); }
.mem { display: flex; flex-wrap: wrap; gap: 6px; }
.m { background: var(--c); color: #fff; border-radius: 8px; padding: 2px 10px; font-family: var(--head); font-weight: 700; font-size: 19px; text-transform: uppercase; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
.m.cp { background: transparent; border: 2px solid var(--c); color: var(--text); text-shadow: none; }
.m.new { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); }
.empty { color: var(--muted); font-size: 15px; }
.final h2 { font-family: var(--head); font-weight: 800; font-style: italic; text-transform: uppercase; font-size: clamp(42px, 9vw, 84px); margin: 0 0 4px; line-height: .95; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin: 18px 0; }
.fgrid .team { border-color: var(--c); box-shadow: 0 0 40px -14px var(--c); }

@media (prefers-reduced-motion: reduce) {
  .bgglow, .ball.rolling { animation: none; }
  .cap, .tile, .slot.filled, .m.new { animation: none; }
}
</style>
</head>
<body>
<div class="bgglow" aria-hidden="true"></div>

<div class="wrap">

  <main id="setup">
    <section class="sec" style="margin-top:6px">
      <div class="sec-h">
        <h2>Capitães</h2>
        <p>Mínimo de 2. Escolha o nome e a cor de cada um.</p>
      </div>
      <div class="caps" id="caps"></div>
    </section>

    <section class="sec">
      <div class="sec-h">
        <h2>Ordem dos picks</h2>
        <div class="seg" id="mode" role="group" aria-label="Modo de ordem">
          <button data-m="snake">Snake (1-2-3-3-2-1)</button>
          <button data-m="linear">Linear (1-2-3-1-2-3)</button>
        </div>
      </div>
    </section>

    <section class="sec">
      <div class="sec-h">
        <h2>Jogadores</h2>
        <p id="pcount">Clique no + para adicionar. Clique no nome para editar.</p>
      </div>
      <div class="players-box"><div class="tiles" id="tiles"></div></div>
    </section>

    <div class="bar" id="bar">
      <div class="status" id="status"></div>
      <button class="start" id="startBtn">Começar draft</button>
    </div>
  </main>

  <main id="draft" hidden></main>
</div>

<div class="overlay" id="draw" hidden role="dialog" aria-label="Sorteio da ordem">
  <button class="closex" id="drawClose" aria-label="Cancelar sorteio">×</button>
  <h2 id="drawTitle">Sorteio da ordem</h2>
  <p id="drawSub"></p>
  <div class="ball rolling" id="ball"><div class="bi" id="ballBox"><span id="ballName"></span></div></div>
  <div class="slots" id="slots"></div>
  <div>
    <button class="obtn" id="drawSkip">Pular animação</button>
    <button class="obtn big" id="drawGo" hidden>Iniciar draft</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  'use strict';
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const PALETTE = ['#2f6bff', '#ff3b3b', '#22c55e', '#f5a524', '#a855f7', '#06b6d4', '#ec4899', '#eab308'];
  const NEUTRAL = '#5b6b8c';
  const MAXCAP = 8, MINCAP = 2;
  const KEY = 'draft-arena-v1';
  const root = document.documentElement;
  let uid = 0;
  const nid = () => 'i' + (++uid) + Math.random().toString(36).slice(2, 6);

  let S = {
    captains: [
      { id: nid(), name: 'Capitão 1', color: PALETTE[0] },
      { id: nid(), name: 'Capitão 2', color: PALETTE[1] }
    ],
    players: [],
    mode: 'snake'
  };

  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY));
      if (d && Array.isArray(d.captains) && d.captains.length >= 2 && Array.isArray(d.players)) {
        S.captains = d.captains.slice(0, MAXCAP).map(c => ({ id: c.id || nid(), name: String(c.name || ''), color: /^#[0-9a-f]{6}$/i.test(c.color) ? c.color : PALETTE[0] }));
        S.players = d.players.filter(p => p && p.name).map(p => ({ id: p.id || nid(), name: String(p.name) }));
        S.mode = d.mode === 'linear' ? 'linear' : 'snake';
      }
    } catch (e) {}
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  let toastT;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400);
  }
  const setGlow = c => root.style.setProperty('--glow', c);

  function fitText(box, max) {
    const s = box.firstElementChild; if (!s) return;
    let size = max || 46;
    s.style.overflowWrap = '';
    box.style.fontSize = size + 'px';
    const over = () => s.scrollWidth > box.clientWidth + 0.5 || s.offsetHeight > box.clientHeight + 0.5;
    while (size > 8 && over()) { size -= 1; box.style.fontSize = size + 'px'; }
    if (over()) { s.style.overflowWrap = 'anywhere'; }
  }
  function fitAll() { document.querySelectorAll('.tile .nm').forEach(n => fitText(n, 46)); }

  function burst(x, y, color, count) {
    for (let i = 0; i < (count || 22); i++) {
      const s = document.createElement('i'); s.className = 'spark';
      const a = Math.random() * Math.PI * 2, d = 80 + Math.random() * 170;
      s.style.cssText = `left:${x}px;top:${y}px;--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px;background:${i % 3 ? color : '#fff'};`;
      document.body.appendChild(s); setTimeout(() => s.remove(), 900);
    }
  }

  /* ---------- capitães ---------- */
  function renderCaptains() {
    const box = $('#caps'); box.innerHTML = '';
    S.captains.forEach((c, i) => {
      const el = document.createElement('div'); el.className = 'cap'; el.style.setProperty('--c', c.color);
      el.innerHTML =
        `<div class="cap-top"><div class="num">${i + 1}</div>
          <input class="capname" maxlength="22" placeholder="Nome do capitão" aria-label="Nome do capitão ${i + 1}" value="${esc(c.name)}"></div>
         <div class="colors">${PALETTE.map(p => `<button class="dot${p.toLowerCase() === c.color.toLowerCase() ? ' on' : ''}" style="--d:${p}" data-c="${p}" aria-label="Cor ${p}"></button>`).join('')}
           <label class="custom" title="Cor personalizada"><input type="color" value="${c.color}" aria-label="Cor personalizada"></label></div>
         <button class="rm${S.captains.length <= MINCAP ? ' off' : ''}" aria-label="Remover capitão" title="Remover capitão">×</button>`;
      $('.capname', el).addEventListener('input', e => { c.name = e.target.value; save(); updateBar(); });
      el.querySelectorAll('.dot').forEach(d => d.addEventListener('click', () => { c.color = d.dataset.c; save(); renderCaptains(); }));
      $('input[type=color]', el).addEventListener('input', e => {
        c.color = e.target.value; el.style.setProperty('--c', c.color);
        el.querySelectorAll('.dot').forEach(d => d.classList.remove('on')); save();
      });
      $('.rm', el).addEventListener('click', () => {
        if (S.captains.length <= MINCAP) { toast('Precisa de no mínimo 2 capitães.'); return; }
        S.captains = S.captains.filter(x => x !== c); save(); renderCaptains(); updateBar();
      });
      box.appendChild(el);
    });
    if (S.captains.length < MAXCAP) {
      const b = document.createElement('button'); b.className = 'addcap'; b.setAttribute('aria-label', 'Adicionar capitão');
      b.innerHTML = '<span><b>+</b>Capitão</span>';
      b.addEventListener('click', () => {
        const used = S.captains.map(c => c.color.toLowerCase());
        const color = PALETTE.find(p => !used.includes(p)) || PALETTE[S.captains.length % PALETTE.length];
        S.captains.push({ id: nid(), name: 'Capitão ' + (S.captains.length + 1), color });
        save(); renderCaptains(); updateBar();
        const inputs = document.querySelectorAll('.capname'); const last = inputs[inputs.length - 1]; if (last) { last.focus(); last.select(); }
      });
      box.appendChild(b);
    }
  }

  function renderMode() {
    document.querySelectorAll('#mode button').forEach(b => {
      b.classList.toggle('on', b.dataset.m === S.mode);
      b.onclick = () => { S.mode = b.dataset.m; save(); renderMode(); };
    });
  }

  /* ---------- jogadores ---------- */
  function renderTiers() {
    const tiles = $('#tiles'); tiles.innerHTML = '';
    S.players.forEach(p => tiles.appendChild(makeTile(p)));
    const add = document.createElement('button'); add.className = 'tile add'; add.setAttribute('aria-label', 'Adicionar jogador'); add.textContent = '+';
    add.addEventListener('click', () => addPlayer());
    tiles.appendChild(add);
    updateCounts(); fitAll();
  }
  function makeTile(p) {
    const t = document.createElement('div'); t.className = 'tile'; t.dataset.id = p.id;
    t.innerHTML = '<div class="nm"><span></span></div><button class="x" aria-label="Remover jogador" title="Remover">×</button>';
    $('span', t).textContent = p.name;
    t.addEventListener('click', e => { if (!e.target.closest('.x')) startEdit(p.id); });
    $('.x', t).addEventListener('click', e => { e.stopPropagation(); removePlayer(p.id); });
    return t;
  }
  function updateCounts() {
    const n = S.players.filter(p => p.name.trim()).length;
    $('#pcount').textContent = n ? `${n} jogador${n > 1 ? 'es' : ''}. clique no nome para editar.` : 'Clique no + para adicionar.';
  }
  function addPlayer() {
    const p = { id: nid(), name: '' }; S.players.push(p);
    const tiles = $('#tiles');
    tiles.insertBefore(makeTile(p), tiles.lastElementChild);
    startEdit(p.id);
  }
  function removePlayer(id) {
    S.players = S.players.filter(p => p.id !== id);
    const t = $(`.tile[data-id="${id}"]`);
    if (t) { t.classList.add('bye'); setTimeout(() => t.remove(), 160); }
    save(); updateCounts(); updateBar();
  }
  function startEdit(id) {
    const t = $(`.tile[data-id="${id}"]`); if (!t || $('.edit', t)) return;
    const p = S.players.find(x => x.id === id); if (!p) return;
    const nm = $('.nm', t); const old = p.name;
    const inp = document.createElement('input'); inp.className = 'edit'; inp.maxLength = 30; inp.value = p.name; inp.placeholder = 'Nome';
    inp.setAttribute('aria-label', 'Nome do jogador');
    nm.style.visibility = 'hidden'; t.appendChild(inp); inp.focus(); inp.select();
    let done = false;
    const finish = (commit, chain) => {
      if (done) return; done = true;
      const v = inp.value.trim(); inp.remove(); nm.style.visibility = '';
      if (commit && v) { p.name = v; $('span', nm).textContent = v; fitText(nm, 46); }
      else if (!old) { removePlayer(id); }
      save(); updateBar(); updateCounts();
      if (chain && commit && v) addPlayer();
    };
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); finish(true, true); }
      else if (e.key === 'Escape') { finish(false); }
    });
    inp.addEventListener('blur', () => finish(true));
  }

  /* ---------- barra / validação ---------- */
  function issues() {
    const list = [];
    const named = S.captains.filter(c => c.name.trim()).length;
    if (S.captains.length < MINCAP) list.push('Mínimo de 2 capitães.');
    if (named < S.captains.length) list.push('Escreva o nome de todos os capitães.');
    if (S.players.filter(p => p.name.trim()).length < 1) list.push('Adicione pelo menos 1 jogador.');
    return list;
  }
  function updateBar() {
    const named = S.captains.filter(c => c.name.trim()).length;
    const np = S.players.filter(p => p.name.trim()).length;
    const capOk = S.captains.length >= MINCAP && named === S.captains.length;
    $('#status').innerHTML =
      `<span class="chip ${capOk ? 'ok' : 'bad'}">${capOk ? '✓' : '✗'} ${named}/${S.captains.length} capitães com nome (mín. 2)</span>
       <span class="chip ${np ? 'ok' : 'bad'}">${np ? '✓' : '✗'} ${np} jogador${np === 1 ? '' : 'es'}</span>`;
    $('#startBtn').classList.toggle('off', issues().length > 0);
  }
  $('#startBtn').addEventListener('click', () => {
    const l = issues();
    if (l.length) {
      toast(l[0]);
      const b = $('#bar'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
      return;
    }
    startDraw();
  });

  /* ---------- sorteio estilo bingo ---------- */
  let skip = false, drawToken = 0;
  const sleep = ms => new Promise(r => setTimeout(r, skip ? 0 : ms));
  function showBall(c) {
    $('#ball').style.setProperty('--bc', c.color);
    $('#ballName').textContent = c.name;
    fitText($('#ballBox'), 60);
    setGlow(c.color);
  }
  function closeDraw() {
    drawToken++; $('#draw').hidden = true; document.body.style.overflow = ''; setGlow(NEUTRAL);
  }
  $('#drawClose').addEventListener('click', closeDraw);
  $('#drawSkip').addEventListener('click', () => { skip = true; });

  async function startDraw() {
    const caps = S.captains.map(c => ({ id: c.id, name: c.name.trim(), color: c.color }));
    const n = caps.length;
    const token = ++drawToken; skip = false;
    $('#draw').hidden = false; document.body.style.overflow = 'hidden';
    $('#drawTitle').textContent = 'Sorteio da ordem';
    $('#drawGo').hidden = true; $('#drawSkip').hidden = false;
    $('#slots').innerHTML = caps.map((_, i) => `<div class="slot" id="slot${i}"><b>${i + 1}ª pick</b><div class="sn"><span></span></div></div>`).join('');
    const ball = $('#ball');
    const remaining = [...caps]; const order = [];
    await sleep(350);
    for (let k = 0; k < n; k++) {
      if (token !== drawToken) return;
      $('#drawSub').textContent = `Sorteando a ${k + 1}ª pick...`;
      const winner = remaining[Math.floor(Math.random() * remaining.length)];
      const steps = remaining.length === 1 ? 7 : 22 + Math.floor(Math.random() * 8);
      let last = null;
      ball.classList.remove('land'); ball.classList.add('rolling');
      for (let i = 0; i < steps; i++) {
        if (token !== drawToken) return;
        let c;
        if (i === steps - 1) c = winner;
        else {
          let pool = remaining.length > 1 ? remaining.filter(x => x !== last) : remaining;
          if (i === steps - 2 && pool.length > 1) pool = pool.filter(x => x !== winner);
          c = pool[Math.floor(Math.random() * pool.length)];
        }
        showBall(c); last = c;
        await sleep(45 + 380 * Math.pow(i / steps, 3));
      }
      if (token !== drawToken) return;
      ball.classList.remove('rolling'); void ball.offsetWidth; ball.classList.add('land');
      const r = ball.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, winner.color, 30);
      const slot = $('#slot' + k); slot.style.setProperty('--c', winner.color); slot.classList.add('filled');
      $('.sn span', slot).textContent = winner.name; fitText($('.sn', slot), 22);
      order.push(winner); remaining.splice(remaining.indexOf(winner), 1);
      await sleep(1300);
    }
    if (token !== drawToken) return;
    $('#drawTitle').textContent = 'Ordem definida!';
    $('#drawSub').textContent = '';
    $('#drawSkip').hidden = true; $('#drawGo').hidden = false;
    $('#drawGo').onclick = () => { if (token === drawToken) startDraft(order); };
  }

  /* ---------- draft ---------- */
  let D = null;
  function showView(v) {
    $('#setup').hidden = v !== 'setup'; $('#draft').hidden = v !== 'draft';
    if (v === 'setup') { setGlow(NEUTRAL); renderTiers(); }
    window.scrollTo(0, 0);
  }
  function startDraft(order) {
    $('#draw').hidden = true; document.body.style.overflow = ''; drawToken++;
    const players = S.players.filter(p => p.name.trim()).map(p => ({ ...p }));
    const n = order.length, seq = [];
    for (let i = 0; i < players.length; i++) {
      const r = Math.floor(i / n), pos = i % n;
      const idx = (S.mode === 'snake' && r % 2 === 1) ? n - 1 - pos : pos;
      seq.push(order[idx].id);
    }
    D = { order, players, seq, picks: [], lock: false, last: null };
    showView('draft'); renderDraft();
  }
  const capOf = id => D.order.find(c => c.id === id);
  const playerOf = id => D.players.find(p => p.id === id);

  function teamsHTML(activeId, finalView) {
    return D.order.map(c => {
      const mem = D.picks.filter(k => k.cid === c.id);
      return `<div class="team${c.id === activeId ? ' active' : ''}" style="--c:${c.color}">
        <h4><i></i>${esc(c.name)}<small>${mem.length + 1} jogador${mem.length ? 'es' : ''}</small></h4>
        <div class="mem"><span class="m cp">★ ${esc(c.name)}</span>${mem.map(k => `<span class="m${k.pid === D.last ? ' new' : ''}">${esc(playerOf(k.pid).name)}</span>`).join('')}</div>
      </div>`;
    }).join('');
  }

  function renderDraft() {
    const v = $('#draft'); const total = D.seq.length, done = D.picks.length, n = D.order.length;
    if (done >= total) { renderFinal(); return; }
    const cur = capOf(D.seq[done]);
    setGlow(cur.color);
    const avail = D.players.filter(p => !D.picks.some(k => k.pid === p.id));
    const upcoming = D.seq.slice(done, done + 8).map(id => capOf(id));
    v.innerHTML = `
      <div class="dhead">
        <div>
          <p class="round">Rodada ${Math.floor(done / n) + 1} · pick ${done + 1} de ${total}</p>
          <h2 class="turn"><em>${esc(cur.name)}</em> escolhe</h2>
        </div>
        <div class="dctl">
          <button class="sbtn" id="undo" ${done ? '' : 'disabled'}>Desfazer</button>
          <button class="sbtn danger" id="exit">Sair do draft</button>
        </div>
      </div>
      <div class="next"><span>Sequência:</span>${upcoming.map(c => `<span class="nx" style="--c:${c.color}">${esc(c.name)}</span>`).join('')}</div>
      <div class="dgrid">
        <section class="pool"><h3>Jogadores disponíveis (${avail.length})</h3>
          <div class="rows">${avail.map(p => `<button class="row" data-id="${p.id}"><span class="rn">${esc(p.name)}</span><span class="go">Escolher</span></button>`).join('')}</div>
        </section>
        <aside class="teams"><h3>Times</h3><div class="tcards">${teamsHTML(cur.id)}</div></aside>
      </div>`;
    v.querySelectorAll('.row').forEach(r => r.addEventListener('click', () => pick(r, cur)));
    $('#undo').addEventListener('click', undo);
    wireExit();
  }
  function pick(rowEl, cur) {
    if (D.lock) return; D.lock = true;
    const id = rowEl.dataset.id;
    const r = rowEl.getBoundingClientRect(); burst(r.left + 60, r.top + r.height / 2, cur.color, 18);
    rowEl.classList.add('taken');
    setTimeout(() => { D.picks.push({ pid: id, cid: cur.id }); D.last = id; D.lock = false; renderDraft(); }, 400);
  }
  function undo() {
    if (D.lock || !D.picks.length) return;
    D.picks.pop(); D.last = null; renderDraft();
  }
  function wireExit() {
    const b = $('#exit'); if (!b) return; let t;
    b.addEventListener('click', () => {
      if (b.classList.contains('armed')) { showView('setup'); return; }
      b.classList.add('armed'); b.textContent = 'Confirmar saída?';
      t = setTimeout(() => { b.classList.remove('armed'); b.textContent = 'Sair do draft'; }, 3000);
    });
  }
  function renderFinal() {
    setGlow(NEUTRAL);
    $('#draft').innerHTML = `
      <div class="final">
        <p class="round">${D.players.length} picks concluídos</p>
        <h2>Draft finalizado</h2>
        <div class="dctl">
          <button class="sbtn" id="undo">Desfazer última pick</button>
          <button class="sbtn" id="again">Refazer sorteio</button>
          <button class="sbtn" id="back">Voltar ao início</button>
        </div>
        <div class="fgrid">${teamsHTML(null, true)}</div>
      </div>`;
    $('#undo').addEventListener('click', undo);
    $('#again').addEventListener('click', startDraw);
    $('#back').addEventListener('click', () => showView('setup'));
    D.order.forEach((c, i) => setTimeout(() => burst(window.innerWidth * (0.15 + 0.7 * Math.random()), window.innerHeight * (0.2 + 0.3 * Math.random()), c.color, 26), i * 220));
  }

  /* ---------- init ---------- */
  load();
  renderCaptains(); renderMode(); renderTiers(); updateBar();
  window.addEventListener('resize', fitAll);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
})();
</script>
</body>
</html>
